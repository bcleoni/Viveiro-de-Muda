<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viveiro de Mudas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --forest:#26402F;
    --forest-light:#3C5C46;
    --moss:#E9EEE5;
    --moss-line:#D3DBC9;
    --clay:#B9713B;
    --clay-light:#F2E2D0;
    --clay-dark:#8A5228;
    --bark:#5B4636;
    --cream:#FAF8F3;
    --paper:#FFFFFF;
    --ink:#22281F;
    --ink-soft:#5A6355;
    --ink-faint:#8D9585;
    --line:#E4E0D3;
    --danger:#A3372E;
    --danger-bg:#F7E7E4;
    --success:#3B7A47;
    --success-bg:#E6EFE3;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Inter',system-ui,sans-serif;
    background:var(--cream);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Fraunces',serif;
    font-weight:500;
    letter-spacing:-0.01em;
    color:var(--forest);
    margin:0;
  }
  .app{max-width:1080px;margin:0 auto;padding:28px 20px 64px;}

  /* Header */
  .hero{
    background:var(--forest);
    color:#F2F3EE;
    padding:36px 20px 32px;
    position:relative;
    overflow:hidden;
  }
  .hero::before{
    content:"";
    position:absolute;
    right:-40px; top:-60px;
    width:280px; height:280px;
    border-radius:50%;
    background:radial-gradient(circle at 30% 30%, rgba(185,113,59,0.35), transparent 70%);
  }
  .hero-inner{max-width:1080px;margin:0 auto;position:relative;}
  .hero-eyebrow{
    font-size:12px;
    letter-spacing:0.09em;
    text-transform:uppercase;
    color:#B7C7B2;
    margin-bottom:6px;
  }
  .hero h1{color:#FBF9F3;font-size:30px;}
  .hero-sub{color:#C6D2C0;font-size:14.5px;margin-top:6px;max-width:520px;line-height:1.55;}

  /* Summary cards */
  .summary{
    display:flex;
    flex-direction:column;
    gap:16px;
    margin-top:26px;
    position:relative;
    z-index:2;
  }
  .summary-group-title{
    font-size:11.5px;
    font-weight:600;
    letter-spacing:0.07em;
    text-transform:uppercase;
    color:#9FB097;
    margin-bottom:8px;
  }
  .summary-row{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:12px;
  }
  .metric{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:12px;
    padding:16px 18px;
    box-shadow:0 10px 24px rgba(38,64,47,0.08);
  }
  .metric-label{font-size:12px;color:var(--ink-faint);margin-bottom:6px;}
  .metric-value{font-family:'Fraunces',serif;font-size:26px;font-weight:500;color:var(--forest);}
  .metric-value.clay{color:var(--clay-dark);}

  /* Nav tabs */
  .tabs{
    display:flex;
    gap:4px;
    margin:32px 0 22px;
    border-bottom:1px solid var(--line);
    overflow-x:auto;
  }
  .tab{
    font-family:'Inter',sans-serif;
    font-size:14px;
    font-weight:500;
    color:var(--ink-soft);
    background:none;
    border:none;
    padding:10px 14px;
    cursor:pointer;
    border-bottom:2px solid transparent;
    white-space:nowrap;
  }
  .tab.active{color:var(--forest);border-bottom-color:var(--clay);}
  .tab:hover:not(.active){color:var(--forest);}

  .panel{display:none;}
  .panel.active{display:block;}

  /* Toolbar */
  .toolbar{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
    margin-bottom:16px;
  }
  .toolbar input[type="text"], .toolbar select, select, input[type="text"], input[type="number"], input[type="date"]{
    font-family:'Inter',sans-serif;
    font-size:13.5px;
    padding:9px 12px;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--paper);
    color:var(--ink);
  }
  .toolbar input[type="text"]{min-width:200px;flex:1;}
  label{font-size:12.5px;color:var(--ink-soft);font-weight:500;display:block;margin-bottom:5px;}

  /* Table */
  .table-wrap{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:12px;
    overflow-x:auto;
  }
  table{width:100%;min-width:520px;border-collapse:collapse;font-size:13.5px;}
  thead th{
    text-align:left;
    font-size:11.5px;
    text-transform:uppercase;
    letter-spacing:0.04em;
    color:var(--ink-faint);
    background:var(--moss);
    padding:10px 14px;
    border-bottom:1px solid var(--moss-line);
    font-weight:600;
    position:sticky;
    top:0;
  }
  th.sortable{cursor:pointer;user-select:none;}
  th.sortable:hover{color:var(--forest);}
  .sort-arrow{display:inline-block;width:10px;margin-left:3px;font-size:10px;}
  th.sort-active{color:var(--forest);}
  tbody td{
    padding:10px 14px;
    border-bottom:1px solid var(--line);
    color:var(--ink);
  }
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#FBFAF6;}
  td.num, th.num{text-align:right;font-variant-numeric:tabular-nums;}
  .badge{
    display:inline-block;
    font-size:11.5px;
    font-weight:600;
    padding:3px 9px;
    border-radius:100px;
  }
  .badge.entrada{background:var(--success-bg);color:var(--success);}
  .badge.saida{background:var(--danger-bg);color:var(--danger);}
  .empty-row td{text-align:center;color:var(--ink-faint);padding:32px;}

  /* Form */
  .form-card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:12px;
    padding:22px 24px;
    max-width:520px;
  }
  .form-row{margin-bottom:16px;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .evento-toggle{display:flex;gap:8px;}
  .evento-btn{
    flex:1;
    padding:10px;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--paper);
    font-family:'Inter',sans-serif;
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
    color:var(--ink-soft);
  }
  .evento-btn.sel-entrada{border-color:var(--success);background:var(--success-bg);color:var(--success);}
  .evento-btn.sel-saida{border-color:var(--danger);background:var(--danger-bg);color:var(--danger);}
  input, select{width:100%;}
  .btn{
    font-family:'Inter',sans-serif;
    font-size:13.5px;
    font-weight:600;
    padding:10px 18px;
    border-radius:8px;
    border:1px solid var(--forest);
    background:var(--forest);
    color:#fff;
    cursor:pointer;
  }
  .btn:hover{background:var(--forest-light);}
  .btn.secondary{background:var(--paper);color:var(--forest);border-color:var(--line);}
  .btn.secondary:hover{background:var(--moss);}
  .error-text{font-size:12.5px;color:var(--danger);margin-top:5px;display:none;}
  .hint{font-size:12.5px;color:var(--ink-faint);margin-top:10px;}
  .list-total{font-size:12.5px;color:var(--ink-soft);margin:-6px 0 14px;font-weight:500;display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
  .subtotal-wrap{display:flex;flex-wrap:wrap;gap:8px;margin:-4px 0 14px;}
  .subtotal-chip{
    font-size:12px;
    background:var(--moss);
    border:1px solid var(--moss-line);
    color:var(--ink-soft);
    padding:5px 10px;
    border-radius:100px;
  }
  .subtotal-chip b{color:var(--forest);font-weight:600;}
  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--forest);color:#fff;padding:10px 20px;border-radius:8px;
    font-size:13.5px;font-weight:500;
    opacity:0;pointer-events:none;transition:opacity .25s;
    z-index:50;
  }
  .toast.show{opacity:1;}

  .section-title{font-size:18px;margin-bottom:14px;}
  .venda-group{margin-bottom:22px;}
  .venda-group-header{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:8px;
  }
  .venda-group-date{
    font-family:'Fraunces',serif;
    font-size:16px;
    font-weight:500;
    color:var(--forest);
  }
  .venda-group-total{
    font-size:13px;
    font-weight:600;
    color:var(--clay-dark);
  }
  .row-flex{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px;}
  datalist{}
  ::placeholder{color:var(--ink-faint);}
  @media (max-width:600px){
    .form-grid{grid-template-columns:1fr;}
    .hero h1{font-size:24px;}
    .metric-value{font-size:21px;}
  }

  .print-header{display:none;}
  @media print{
    .no-print{display:none !important;}
    .hero{display:none !important;}
    .tabs{display:none !important;}
    .toolbar select, .toolbar input{display:none !important;}
    .app{padding:0;max-width:100%;}
    body{background:#fff;}
    .print-header{
      display:block;
      font-family:'Fraunces',serif;
      font-size:18px;
      font-weight:500;
      color:var(--forest);
      margin-bottom:4mm;
      padding:0 0 3mm;
      border-bottom:2px solid var(--forest);
    }
    .table-wrap{border:none;box-shadow:none;}
    thead th{position:static;}
    .venda-group{break-inside:avoid;}
  }
</style>
</head>
<body>
<div class="print-header" id="printHeader"></div>

<div class="hero">
  <div class="hero-inner">
    <h1>Viveiro de Mudas</h1>
    <div class="summary" id="summaryCards"></div>
  </div>
</div>

<div class="app">
  <div class="tabs" id="tabs">
    <button class="tab" data-tab="especies">Espécies</button>
    <button class="tab active" data-tab="estoque">Estoque</button>
    <button class="tab" data-tab="interesse">Hotlist</button>
    <button class="tab" data-tab="movimentacoes">Movimentações</button>
    <button class="tab" data-tab="vendas">Vendas</button>
    <button class="tab" data-tab="nativas">Espécies Nativas</button>
  </div>

  <!-- ESTOQUE ATUAL -->
  <div class="panel active" id="panel-estoque">
    <div class="toolbar">
      <input type="text" id="estoqueBusca" placeholder="Buscar espécie...">
      <div>
        <label style="margin-bottom:0;display:inline;">Sítio</label>
        <select id="estoqueFiltroSitio" style="width:auto;"></select>
      </div>
      <div>
        <label style="margin-bottom:0;display:inline;">Lote</label>
        <select id="estoqueFiltroLote" style="width:auto;"></select>
      </div>
      <button class="btn secondary no-print" onclick="exportarPDF('Estoque')">Exportar PDF</button>
    </div>
    <div class="list-total" id="estoqueTotal"></div>
    <div id="estoqueGroups"></div>
  </div>

  <!-- MOVIMENTAÇÕES -->
  <div class="panel" id="panel-movimentacoes">
    <div class="toolbar">
      <input type="text" id="movBusca" placeholder="Buscar espécie...">
      <select id="movFiltroEvento" style="width:auto;">
        <option value="">Todos eventos</option>
        <option value="Entrada">Entrada</option>
        <option value="Saída">Saída</option>
      </select>
      <button class="btn secondary no-print" onclick="exportarPDF('Movimentações')">Exportar PDF</button>
    </div>
    <div class="list-total" id="movTotal"></div>
    <div id="movSubtotais" class="subtotal-wrap"></div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th class="sortable" data-table="mov" data-key="data">Data<span class="sort-arrow"></span></th>
            <th class="sortable" data-table="mov" data-key="evento">Evento<span class="sort-arrow"></span></th>
            <th class="sortable" data-table="mov" data-key="especie">Espécie<span class="sort-arrow"></span></th>
            <th class="sortable" data-table="mov" data-key="sitio">Sítio<span class="sort-arrow"></span></th>
            <th class="sortable" data-table="mov" data-key="lote">Lote<span class="sort-arrow"></span></th>
            <th class="num sortable" data-table="mov" data-key="qtde">Qtde<span class="sort-arrow"></span></th>
          </tr>
        </thead>
        <tbody id="movBody"></tbody>
      </table>
    </div>
  </div>

  <!-- ESPÉCIES -->
  <div class="panel" id="panel-especies">
    <div class="toolbar">
      <input type="text" id="espBusca" placeholder="Buscar espécie...">
      <div>
        <label style="margin-bottom:0;display:inline;">Sítio</label>
        <select id="espFiltroSitio" style="width:auto;"></select>
      </div>
      <div>
        <label style="margin-bottom:0;display:inline;">Lote</label>
        <select id="espFiltroLote" style="width:auto;"></select>
      </div>
      <button class="btn secondary no-print" onclick="exportarPDF('Espécies')">Exportar PDF</button>
    </div>
    <div class="list-total" id="espTotal"></div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th class="sortable" data-table="esp" data-key="especie">Espécie<span class="sort-arrow"></span></th>
            <th class="num sortable" data-table="esp" data-key="sitios">Sítios<span class="sort-arrow"></span></th>
            <th class="num sortable" data-table="esp" data-key="lotes">Lotes<span class="sort-arrow"></span></th>
            <th class="num sortable" data-table="esp" data-key="qtde">Estoque total<span class="sort-arrow"></span></th>
          </tr>
        </thead>
        <tbody id="espBody"></tbody>
      </table>
    </div>
  </div>

  <!-- LISTA DE INTERESSE MANEQUINHO -->
  <div class="panel" id="panel-interesse">
    <div class="toolbar">
      <input type="text" id="interesseBusca" placeholder="Buscar espécie...">
      <select id="interesseFiltroStatus" style="width:auto;">
        <option value="">Todas</option>
        <option value="tem">Já no estoque</option>
        <option value="nao">Ainda não temos</option>
      </select>
      <button class="btn secondary no-print" onclick="exportarPDF('Hotlist')">Exportar PDF</button>
    </div>
    <div class="list-total" id="interesseTotal"></div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th class="sortable" data-table="interesse" data-key="comum">Nome popular<span class="sort-arrow"></span></th>
            <th class="sortable" data-table="interesse" data-key="cientifico">Nome científico<span class="sort-arrow"></span></th>
            <th>Status</th>
            <th class="num sortable" data-table="interesse" data-key="qtde">#Mudas em Estoque<span class="sort-arrow"></span></th>
          </tr>
        </thead>
        <tbody id="interesseBody"></tbody>
      </table>
    </div>
  </div>

  <!-- VENDAS -->
  <div class="panel" id="panel-vendas">
    <div class="toolbar">
      <input type="text" id="vendasBusca" placeholder="Buscar espécie...">
      <button class="btn secondary no-print" onclick="exportarPDF('Vendas')">Exportar PDF</button>
    </div>
    <div class="summary" style="margin-top:0;margin-bottom:16px;">
      <div class="summary-row">
        <div class="metric">
          <div class="metric-label">Total vendido</div>
          <div class="metric-value" id="vendasTotalMudas">0</div>
        </div>
        <div class="metric">
          <div class="metric-label">Vendas registradas</div>
          <div class="metric-value" id="vendasTotalRegistros">0</div>
        </div>
      </div>
    </div>
    <div id="vendasGroups"></div>
  </div>

  <!-- LISTA DE ESPÉCIES NATIVA_MUNICIPIO -->
  <div class="panel" id="panel-nativas">
    <div class="toolbar">
      <input type="text" id="nativasBusca" placeholder="Buscar por espécie, nome popular ou família...">
      <button class="btn secondary no-print" onclick="exportarPDF('Espécies Nativas')">Exportar PDF</button>
    </div>
    <div class="list-total" id="nativasTotal"></div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th class="sortable" data-table="nativas" data-key="familia">Família<span class="sort-arrow"></span></th>
            <th class="sortable" data-table="nativas" data-key="cientifico">Nome científico<span class="sort-arrow"></span></th>
            <th>Sinônimo</th>
            <th class="sortable" data-table="nativas" data-key="popular">Nome popular<span class="sort-arrow"></span></th>
          </tr>
        </thead>
        <tbody id="nativasBody"></tbody>
      </table>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

function normalizeNome(s){
  return s.toString().trim().toLowerCase()
    .normalize('NFKD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]+/g,'');
}

function buscaNorm(s){
  return s.toString().trim().toLowerCase()
    .normalize('NFKD').replace(/[\u0300-\u036f]/g,'');
}

function computeInteresseStatus(){
  const especiesQtde = new Map(); // norm -> total qtde em estoque
  computeSpecies().forEach(e=>{
    especiesQtde.set(normalizeNome(e.especie), e.qtde);
  });
  return INTERESSE.map(item=>{
    const norm = item.norm;
    const tem = especiesQtde.has(norm);
    const qtde = tem ? especiesQtde.get(norm) : 0;
    return {comum: item.comum, cientifico: item.cientifico, tem, qtde};
  });
}

function applySort(list, tableId, defaultCmp){
  const st = sortState[tableId];
  if(!st) return list;
  list.sort((a,b)=>{
    let va = a[st.key], vb = b[st.key];
    if(tableId==='mov' && st.key==='data'){
      va = parseData(a.data); vb = parseData(b.data);
    }
    if(typeof va === 'string' && typeof vb === 'string'){
      return va.localeCompare(vb,'pt-BR') * st.dir;
    }
    return ((va>vb)-(va<vb)) * st.dir;
  });
  return list;
}

function updateSortHeaders(){
  document.querySelectorAll('th.sortable').forEach(th=>{
    const tableId = th.dataset.table;
    const key = th.dataset.key;
    const st = sortState[tableId];
    const arrow = th.querySelector('.sort-arrow');
    if(st && st.key === key){
      th.classList.add('sort-active');
      arrow.textContent = st.dir === 1 ? '▲' : '▼';
    } else {
      th.classList.remove('sort-active');
      arrow.textContent = '';
    }
  });
}

document.querySelectorAll('th.sortable').forEach(th=>{
  th.addEventListener('click', ()=>{
    const tableId = th.dataset.table;
    const key = th.dataset.key;
    const st = sortState[tableId];
    if(st.key === key){
      st.dir *= -1;
    } else {
      st.key = key;
      st.dir = 1;
    }
    if(tableId==='estoque') renderEstoque();
    if(tableId==='mov') renderMovimentacoes();
    if(tableId==='esp') renderEspecies();
    if(tableId==='interesse') renderInteresse();
    if(tableId==='nativas') renderNativas();
  });
});

  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);

  const dataHoje = new Date().toLocaleDateString('pt-BR');
  document.getElementById('printHeader').textContent = `Viveiro de Mudas — ${tituloAba} — ${dataHoje}`;
  window.print();
}

function parseData(str){
  // dd/mm/aaaa -> Date, for sorting
  const [d,m,y] = str.split('/').map(Number);
  return new Date(y, m-1, d);
}

function fmtNum(n){
  return new Intl.NumberFormat('pt-BR').format(n);
}

const hasCloudStorage = typeof window.storage !== 'undefined' && window.storage !== null && typeof window.storage.get === 'function';

async function storageGet(key){
  if(hasCloudStorage){
    try{
      const res = await window.storage.get(key, false);
      return res ? res.value : null;
    }catch(e){
      return null;
    }
  }
  try{
    return window.localStorage.getItem(key);
  }catch(e){
    return null;
  }
}

async function storageSet(key, value){
  if(hasCloudStorage){
    try{
      await window.storage.set(key, value, false);
      return true;
    }catch(e){
      console.error('Erro ao salvar (cloud)', e);
      return false;
    }
  }
  try{
    window.localStorage.setItem(key, value);
    return true;
  }catch(e){
    console.error('Erro ao salvar (local)', e);
    return false;
  }
}

    {especie:'GUAPURUVU', qtde:-26, sitio:'1', lote:'2', dataAntiga:'13/08/2026', dataNova:'30/07/2026'},
    {especie:'ACASSIA VERMELHA', qtde:-25, sitio:'1', lote:'1', dataAntiga:'13/08/2026', dataNova:'01/07/2026'},
    {especie:'EMBAÚBA', qtde:-15, sitio:'1', lote:'2', dataAntiga:'13/08/2026', dataNova:'01/07/2026'},
    {especie:'TAMBORIL', qtde:-15, sitio:'1', lote:'2', dataAntiga:'13/08/2026', dataNova:'01/07/2026'},
  ];
  movimentacoes.forEach(m=>{
    if(m.evento !== 'Saída' || m.data !== '13/08/2026') return;
    const fix = correcoesSaida.find(c =>
      c.especie === m.especie && c.qtde === m.qtde && c.sitio === m.sitio && c.lote === m.lote && c.dataAntiga === m.data
    );
    if(fix){
      m.data = fix.dataNova;
      migrated = true;
    }
  });
  if(!loaded || migrated) await saveData();
}

async function saveData(){
  const ok = await storageSet(STORAGE_KEY, JSON.stringify(movimentacoes));
  if(!ok) toast('Não foi possível salvar os dados neste dispositivo.');
}

function computeStock(){
  // group by especie+sitio+lote
  const map = new Map();
  movimentacoes.forEach(m=>{
    const key = m.especie + '|' + m.sitio + '|' + m.lote;
    if(!map.has(key)) map.set(key, {especie:m.especie, sitio:m.sitio, lote:m.lote, qtde:0});
    map.get(key).qtde += m.qtde;
  });
  return Array.from(map.values());
}

function computeLotes(){
  // group only by sitio+lote (sum across all species)
  const map = new Map();
  movimentacoes.forEach(m=>{
    const key = m.sitio + '|' + m.lote;
    if(!map.has(key)) map.set(key, {sitio:m.sitio, lote:m.lote, qtde:0});
    map.get(key).qtde += m.qtde;
  });
  return Array.from(map.values());
}

function computeSpecies(){
  const map = new Map();
  movimentacoes.forEach(m=>{
    if(!map.has(m.especie)) map.set(m.especie, {especie:m.especie, sitios:new Set(), lotes:new Set(), qtde:0});
    const e = map.get(m.especie);
    e.sitios.add(m.sitio);
    e.lotes.add(m.sitio+'|'+m.lote);
    e.qtde += m.qtde;
  });
  return Array.from(map.values());
}

function computeSpeciesFiltered(filtroSitio, filtroLote){
  let stock = computeStock().filter(r=>r.qtde!==0);
  if(filtroSitio) stock = stock.filter(r=>r.sitio===filtroSitio);
  if(filtroLote) stock = stock.filter(r=>r.lote===filtroLote);
  const map = new Map();
  stock.forEach(r=>{
    if(!map.has(r.especie)) map.set(r.especie, {especie:r.especie, sitios:new Set(), lotes:new Set(), qtde:0});
    const e = map.get(r.especie);
    e.sitios.add(r.sitio);
    e.lotes.add(r.sitio+'|'+r.lote);
    e.qtde += r.qtde;
  });
  return Array.from(map.values());
}

function computeEspecieBreakdown(especie, filtroSitio, filtroLote){
  let rows = computeStock().filter(r=>r.especie===especie && r.qtde!==0);
  if(filtroSitio) rows = rows.filter(r=>r.sitio===filtroSitio);
  if(filtroLote) rows = rows.filter(r=>r.lote===filtroLote);
  return rows.sort((a,b)=> a.sitio.localeCompare(b.sitio,'pt-BR') || a.lote.localeCompare(b.lote,'pt-BR'));
}

function uniqueSorted(arr){
  return Array.from(new Set(arr)).sort((a,b)=>a.localeCompare(b,'pt-BR'));
}

function renderSummary(){
  const stock = computeStock();
  const totalMudas = stock.reduce((s,r)=>s+r.qtde, 0);
  const especies = new Set(movimentacoes.map(m=>m.especie)).size;
  const sitiosTotal = new Set(movimentacoes.filter(m=>m.sitio!=='Área de acesso').map(m=>m.sitio)).size;
  const lotes = computeLotes().filter(r=>r.sitio!=='Área de acesso');
  const lotesTotal = lotes.length;
  const lotesAtivos = lotes.filter(r=>r.qtde>0).length;
  const entradas = movimentacoes.filter(m=>m.evento==='Entrada').length;
  const saidas = movimentacoes.filter(m=>m.evento==='Saída').length;
  const qtdeEntradas = movimentacoes.filter(m=>m.evento==='Entrada').reduce((s,m)=>s+m.qtde, 0);
  const qtdeSaidas = movimentacoes.filter(m=>m.evento==='Saída').reduce((s,m)=>s+Math.abs(m.qtde), 0);
  const qtdeAlternado = movimentacoes.filter(m=>m.sitio==='Área de acesso').reduce((s,m)=>s+m.qtde, 0);

  const grupos = [
    {
      titulo: 'Informações gerais',
      cards: [
        {label:'Mudas em estoque', value: fmtNum(totalMudas)},
        {label:'Espécies cadastradas', value: fmtNum(especies)},
      ]
    },
    {
      titulo: 'Movimentações',
      cards: [
        {label:'Total de mudas — entradas', value: fmtNum(qtdeEntradas)},
        {label:'Total de mudas — saídas', value: fmtNum(qtdeSaidas)},
      ]
    },
    {
      titulo: 'Estrutura',
      cards: [
        {label:'Sítios', value: fmtNum(sitiosTotal)},
        {label:'Lotes', value: fmtNum(lotesTotal)},
        {label:'Lotes com estoque', value: fmtNum(lotesAtivos)},
        {label:'Alternado', value: `${fmtNum(qtdeAlternado)} <span style="font-size:13px;font-weight:500;color:var(--ink-faint);">(Resedás)</span>`},
      ]
    },
  ];

  document.getElementById('summaryCards').innerHTML = grupos.map(g => `
    <div class="summary-group">
      <div class="summary-group-title">${g.titulo}</div>
      <div class="summary-row">
        ${g.cards.map(c=>`
          <div class="metric">
            <div class="metric-label">${c.label}</div>
            <div class="metric-value">${c.value}</div>
          </div>
        `).join('')}
      </div>
    </div>
  `).join('');
}

function renderEstoqueFiltros(){
  const sitios = uniqueSorted(movimentacoes.map(m=>m.sitio));
  const sel = document.getElementById('estoqueFiltroSitio');
  const current = sel.value;
  sel.innerHTML = '<option value="">Todos os sítios</option>' + sitios.map(s=>`<option value="${s}">${s==='Área de acesso'?s:'Sítio '+s}</option>`).join('');
  if(sitios.includes(current)) sel.value = current;

  const filtroSitio = sel.value;
  const lotesBase = filtroSitio
    ? movimentacoes.filter(m=>m.sitio===filtroSitio)
    : movimentacoes;
  const lotes = uniqueSorted(lotesBase.map(m=>m.lote));
  const selLote = document.getElementById('estoqueFiltroLote');
  const currentLote = selLote.value;
  selLote.innerHTML = '<option value="">Todos os lotes</option>' + lotes.map(l=>`<option value="${l}">${l==='Área de acesso'?l:'Lote '+l}</option>`).join('');
  if(lotes.includes(currentLote)) selLote.value = currentLote;
}

function renderEstoque(){
  const busca = buscaNorm(document.getElementById('estoqueBusca').value);
  const filtroSitio = document.getElementById('estoqueFiltroSitio').value;
  const filtroLote = document.getElementById('estoqueFiltroLote').value;
  let stock = computeStock().filter(r=>r.qtde !== 0);
  if(busca) stock = stock.filter(r=>buscaNorm(r.especie).includes(busca));
  if(filtroSitio) stock = stock.filter(r=>r.sitio === filtroSitio);
  if(filtroLote) stock = stock.filter(r=>r.lote === filtroLote);

  const totalQtde = stock.reduce((s,r)=>s+r.qtde,0);
  document.getElementById('estoqueTotal').textContent = `${fmtNum(stock.length)} registro(s) — ${fmtNum(totalQtde)} mudas`;

  const container = document.getElementById('estoqueGroups');
  if(stock.length===0){
    container.innerHTML = '<div class="table-wrap"><table><tbody><tr class="empty-row"><td>Nenhum registro de estoque encontrado.</td></tr></tbody></table></div>';
    return;
  }

  const grupos = new Map();
  stock.forEach(r=>{
    if(!grupos.has(r.sitio)) grupos.set(r.sitio, []);
    grupos.get(r.sitio).push(r);
  });
  const sitiosOrdenados = Array.from(grupos.keys()).sort((a,b)=>a.localeCompare(b,'pt-BR'));

  container.innerHTML = sitiosOrdenados.map(sitio=>{
    const itens = grupos.get(sitio).sort((a,b)=> a.especie.localeCompare(b.especie,'pt-BR') || a.lote.localeCompare(b.lote,'pt-BR'));
    const subtotal = itens.reduce((s,r)=>s+r.qtde,0);
    const rotulo = sitio==='Área de acesso' ? sitio : `Sítio ${sitio}`;
    return `
    <div class="venda-group">
      <div class="venda-group-header">
        <span class="venda-group-date">${rotulo}</span>
        <span class="venda-group-total">${fmtNum(subtotal)} mudas</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Espécie</th>
              <th>Lote</th>
              <th class="num">Estoque</th>
            </tr>
          </thead>
          <tbody>
            ${itens.map(r=>`
              <tr>
                <td>${r.especie}</td>
                <td>${r.lote}</td>
                <td class="num">${fmtNum(r.qtde)}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    </div>`;
  }).join('');
}

function renderMovimentacoes(){
  const busca = buscaNorm(document.getElementById('movBusca').value);
  const filtroEvento = document.getElementById('movFiltroEvento').value;
  let list = movimentacoes.slice();
  if(busca) list = list.filter(m=>buscaNorm(m.especie).includes(busca));
  if(filtroEvento) list = list.filter(m=>m.evento === filtroEvento);
  applySort(list, 'mov');

  const totalEntradas = list.filter(m=>m.evento==='Entrada').reduce((s,m)=>s+m.qtde,0);
  const totalSaidas = list.filter(m=>m.evento==='Saída').reduce((s,m)=>s+Math.abs(m.qtde),0);
  document.getElementById('movTotal').textContent = `${fmtNum(list.length)} registro(s) — ${fmtNum(totalEntradas)} entradas, ${fmtNum(totalSaidas)} saídas`;

  const porSitio = new Map();
  list.forEach(m=>{
    if(!porSitio.has(m.sitio)) porSitio.set(m.sitio, {entradas:0, saidas:0});
    const s = porSitio.get(m.sitio);
    if(m.evento==='Entrada') s.entradas += m.qtde;
    else s.saidas += Math.abs(m.qtde);
  });
  const sitiosOrdenados = Array.from(porSitio.keys()).sort((a,b)=>a.localeCompare(b,'pt-BR'));
  document.getElementById('movSubtotais').innerHTML = sitiosOrdenados.map(sitio=>{
    const s = porSitio.get(sitio);
    const rotulo = sitio==='Área de acesso' ? sitio : `Sítio ${sitio}`;
    return `<span class="subtotal-chip">${rotulo}: <b>${fmtNum(s.entradas)}</b> entradas, <b>${fmtNum(s.saidas)}</b> saídas</span>`;
  }).join('');

  const body = document.getElementById('movBody');
  if(list.length===0){
    body.innerHTML = '<tr class="empty-row"><td colspan="6">Nenhuma movimentação encontrada.</td></tr>';
    updateSortHeaders();
    return;
  }
  body.innerHTML = list.map(m=>`
    <tr>
      <td>${m.data}</td>
      <td><span class="badge ${m.evento==='Entrada'?'entrada':'saida'}">${m.evento}</span></td>
      <td>${m.especie}</td>
      <td>${m.sitio}</td>
      <td>${m.lote}</td>
      <td class="num">${m.qtde>0?'+':''}${fmtNum(m.qtde)}</td>
    </tr>
  `).join('');
  updateSortHeaders();
}

function renderEspecies(){
  const busca = buscaNorm(document.getElementById('espBusca').value);
  const filtroSitio = document.getElementById('espFiltroSitio').value;
  const filtroLote = document.getElementById('espFiltroLote').value;
  let list = computeSpeciesFiltered(filtroSitio, filtroLote).map(e=>({
    especie: e.especie,
    sitios: e.sitios.size,
    lotes: e.lotes.size,
    qtde: e.qtde
  }));
  if(busca) list = list.filter(e=>buscaNorm(e.especie).includes(busca));
  applySort(list, 'esp');

  const totalQtde = list.reduce((s,e)=>s+e.qtde,0);
  document.getElementById('espTotal').textContent = `${fmtNum(list.length)} espécie(s) — ${fmtNum(totalQtde)} mudas`;

  const body = document.getElementById('espBody');
  if(list.length===0){
    body.innerHTML = '<tr class="empty-row"><td colspan="4">Nenhuma espécie encontrada.</td></tr>';
    updateSortHeaders();
    return;
  }
  body.innerHTML = list.map(e=>{
    const expandible = e.lotes > 1;
    let rows = `
    <tr>
      <td>${e.especie}</td>
      <td class="num">${fmtNum(e.sitios)}</td>
      <td class="num">${fmtNum(e.lotes)}</td>
      <td class="num">${fmtNum(e.qtde)}</td>
    </tr>`;
    if(expandible){
      const breakdown = computeEspecieBreakdown(e.especie, filtroSitio, filtroLote);
      rows += breakdown.map(b=>`
        <tr style="background:#FBFAF6;">
          <td style="padding-left:20px;color:var(--ink-soft);font-size:12.5px;">Sítio ${b.sitio} · Lote ${b.lote}</td>
          <td></td>
          <td></td>
          <td class="num" style="color:var(--ink-soft);font-size:12.5px;">${fmtNum(b.qtde)}</td>
        </tr>
      `).join('');
    }
    return rows;
  }).join('');
  updateSortHeaders();
}

function renderInteresse(){
  const busca = buscaNorm(document.getElementById('interesseBusca').value);
  const filtroStatus = document.getElementById('interesseFiltroStatus').value;
  let list = computeInteresseStatus();
  if(busca) list = list.filter(i => buscaNorm(i.comum).includes(busca) || buscaNorm(i.cientifico).includes(busca));
  if(filtroStatus === 'tem') list = list.filter(i=>i.tem);
  if(filtroStatus === 'nao') list = list.filter(i=>!i.tem);
  applySort(list, 'interesse');

  const jaTemCount = list.filter(i=>i.tem).length;
  const naoTemCount = list.length - jaTemCount;
  const totalMudas = list.reduce((s,i)=>s+(i.tem?i.qtde:0),0);
  document.getElementById('interesseTotal').innerHTML = `
    <span class="subtotal-chip">${fmtNum(list.length)} espécie(s) na lista</span>
    <span class="subtotal-chip">${fmtNum(jaTemCount)} em estoque — <b>${fmtNum(totalMudas)} mudas</b></span>
    <span class="subtotal-chip">${fmtNum(naoTemCount)} ainda não temos</span>
  `;

  const body = document.getElementById('interesseBody');
  if(list.length===0){
    body.innerHTML = '<tr class="empty-row"><td colspan="4">Nenhuma espécie encontrada.</td></tr>';
    updateSortHeaders();
    return;
  }
  body.innerHTML = list.map(i=>`
    <tr>
      <td>${i.comum}</td>
      <td style="font-style:italic;color:var(--ink-soft);">${i.cientifico || '—'}</td>
      <td>${i.tem ? '<span class="badge entrada">Já no estoque</span>' : '<span class="badge saida">Ainda não temos</span>'}</td>
      <td class="num">${i.tem ? fmtNum(i.qtde) : '—'}</td>
    </tr>
  `).join('');
  updateSortHeaders();
}

function computeVendas(){
  const vendas = movimentacoes.filter(m=>m.evento==='Saída');
  const map = new Map();
  vendas.forEach(v=>{
    if(!map.has(v.data)) map.set(v.data, []);
    map.get(v.data).push(v);
  });
  const groups = Array.from(map.entries()).map(([data, itens])=>({
    data, dataObj: parseData(data), itens,
    total: itens.reduce((s,i)=>s+Math.abs(i.qtde),0)
  }));
  groups.sort((a,b)=> b.dataObj - a.dataObj);
  return groups;
}

function renderVendas(){
  const busca = buscaNorm(document.getElementById('vendasBusca').value);
  let groups = computeVendas();
  if(busca){
    groups = groups.map(g=>({...g, itens: g.itens.filter(i=>buscaNorm(i.especie).includes(busca))}))
                    .filter(g=>g.itens.length>0)
                    .map(g=>({...g, total: g.itens.reduce((s,i)=>s+Math.abs(i.qtde),0)}));
  }

  const totalMudas = groups.reduce((s,g)=>s+g.total,0);
  const totalRegistros = groups.reduce((s,g)=>s+g.itens.length,0);
  document.getElementById('vendasTotalMudas').textContent = fmtNum(totalMudas);
  document.getElementById('vendasTotalRegistros').textContent = fmtNum(totalRegistros);

  const container = document.getElementById('vendasGroups');
  if(groups.length===0){
    container.innerHTML = '<div class="table-wrap"><table><tbody><tr class="empty-row"><td>Nenhuma venda encontrada.</td></tr></tbody></table></div>';
    return;
  }
  container.innerHTML = groups.map(g=>`
    <div class="venda-group">
      <div class="venda-group-header">
        <span class="venda-group-date">${g.data}</span>
        <span class="venda-group-total">${fmtNum(g.total)} mudas vendidas</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Espécie</th>
              <th>Sítio</th>
              <th>Lote</th>
              <th class="num">Qtde vendida</th>
            </tr>
          </thead>
          <tbody>
            ${g.itens.map(i=>`
              <tr>
                <td>${i.especie}</td>
                <td>${i.sitio}</td>
                <td>${i.lote}</td>
                <td class="num">${fmtNum(Math.abs(i.qtde))}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `).join('');
}

function renderNativas(){
  const busca = buscaNorm(document.getElementById('nativasBusca').value);
  let list = NATIVAS.slice();
  if(busca){
    list = list.filter(n =>
      buscaNorm(n.familia).includes(busca) ||
      buscaNorm(n.cientifico).includes(busca) ||
      buscaNorm(n.sinonimo).includes(busca) ||
      buscaNorm(n.popular).includes(busca)
    );
  }
  applySort(list, 'nativas');

  document.getElementById('nativasTotal').textContent = `${fmtNum(list.length)} espécie(s) encontrada(s)`;

  const body = document.getElementById('nativasBody');
  if(list.length===0){
    body.innerHTML = '<tr class="empty-row"><td colspan="4">Nenhuma espécie encontrada.</td></tr>';
    updateSortHeaders();
    return;
  }
  body.innerHTML = list.map(n=>`
    <tr>
      <td>${n.familia}</td>
      <td style="font-style:italic;color:var(--ink-soft);">${n.cientifico}</td>
      <td style="font-style:italic;color:var(--ink-faint);">${n.sinonimo || '—'}</td>
      <td>${n.popular || '—'}</td>
    </tr>
  `).join('');
  updateSortHeaders();
}

function renderAll(){
  renderSummary();
  renderEstoqueFiltros();
  renderEstoque();
  renderMovimentacoes();
  renderEspFiltros();
  renderEspecies();
  renderInteresse();
  renderVendas();
  renderNativas();
}

});
